name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint + Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (no Electron binary)
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Environment doctor (non-fatal)
        run: npm run doctor || true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Benchmarks (informational)
        run: npm run benchmark
